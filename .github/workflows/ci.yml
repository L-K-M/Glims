name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs. Added family-wide because GitHub throttled webhook delivery
  # during an Actions incident and pull_request events stopped starting
  # workflows at all; dispatch goes through the API instead. Re-running CI also
  # no longer needs an empty commit.
  workflow_dispatch:

# Least privilege: the build/test job only needs to read the repo.
permissions:
  contents: read

# Cancel an in-progress run when a *PR branch* is pushed again, but never cancel a
# push to main, or that commit is left with a permanently "cancelled" status
# (masking breakage and putting holes in CI-status bisection).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  component-codec:
    name: Component codec sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Xcode 26's ASan executable hangs before output on the hosted macOS
      # 26.7.2 image. Keep both sanitizers required on this portable C codec;
      # the native Mac job still checks its optimized implementation.
      - name: Check optimized and sanitized component metadata codec
        run: bash scripts/test-plate-map.sh
      - name: Check optimized and sanitized native CMYK PSD codec
        run: bash scripts/test-cmyk-psd-codec.sh
      - name: Check optimized and sanitized Bitmap PSD codec
        run: bash scripts/test-bitmap-psd-codec.sh
      - name: Check optimized and sanitized native CMYK PSD reader
        run: bash scripts/test-cmyk-psd-reader.sh
      - name: Check optimized and sanitized native CMYK PSD file transaction
        run: bash scripts/test-cmyk-psd-file.sh
      - name: Check optimized and sanitized Duotone PSD codec
        run: bash scripts/test-duotone-psd-codec.sh
      - name: Check optimized and sanitized Duotone settings
        run: bash scripts/test-duotone-options.sh
      - name: Check optimized and sanitized Duotone PSD file transaction
        run: bash scripts/test-duotone-psd-file.sh
      - name: Check optimized and sanitized Bitmap PSD file transaction
        run: bash scripts/test-bitmap-psd-file.sh
      - name: Check optimized and sanitized Bitmap diffusion
        run: bash scripts/test-bitmap-diffusion.sh
      - name: Check optimized and sanitized Bitmap PSD transaction faults
        run: bash scripts/test-bitmap-psd-file-faults.sh
      - name: Check optimized and sanitized CMYK PSD transaction faults
        run: bash scripts/test-cmyk-psd-file-faults.sh
      - name: Check optimized and sanitized scalar ink arithmetic
        run: bash scripts/test-component-scalar.sh
      - name: Check optimized and sanitized scalar ink Levels
        run: bash scripts/test-component-levels.sh
      - name: Check scalar ink Curves
        run: bash scripts/test-component-curves.sh
      - name: Check optimized and sanitized Lab samples
        run: python3 scripts/test-lab-samples.py
      - name: Check optimized and sanitized physical Lab fills
        run: python3 scripts/test-lab-fill.py
      - name: Check optimized and sanitized physical Lab curves
        run: python3 scripts/test-lab-curves.py
      - name: Check optimized and sanitized physical Lab Levels
        run: python3 scripts/test-lab-levels.py
      - name: Check optimized and sanitized Lab layer map
        run: python3 scripts/test-lab-layer-map.py
      - name: Check optimized and sanitized Lab layer composite
        run: python3 scripts/test-lab-layer-composite.py
      - name: Check optimized and sanitized Lab brush coverage
        run: python3 scripts/test-lab-brush-coverage.py
      - name: Check physical layered Lab paint against the rational oracle
        run: python3 scripts/test-lab-layer-paint.py

  build-test:
    name: Build, Test & Package
    runs-on: macos-26
    timeout-minutes: 30   # a wedged build shouldn't burn the 6h default job limit
    steps:
      # Actions are pinned to immutable commit SHAs: a mutable tag like @v4 can be
      # repointed at tampered code after the fact, a commit SHA cannot. Same
      # pin-and-verify discipline zai-code-review.yml already uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here runs git after checkout

      # License statements must agree with LICENSE (GPLv3, which the GIMP engine
      # requires), and the bundle identity with the fleet's ch.lkmc.* namespace,
      # before paying for a build.
      - name: Check license statements and bundle identity
        run: |
          sed -n 1p LICENSE | grep -q 'GNU GENERAL PUBLIC LICENSE' && sed -n 2p LICENSE | grep -q 'Version 3, 29 June 2007' \
            || { echo "::error::LICENSE must be the GNU GPL version 3 text"; exit 1; }
          grep -q '^## License$' README.md || { echo "::error::README.md lacks its '## License' section"; exit 1; }
          grep -q 'GPL-3.0-or-later' README.md || { echo "::error::README.md must state GPL-3.0-or-later"; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSHumanReadableCopyright' Resources/Info.plist)" = 'Licensed under GPL-3.0-or-later' \
            || { echo "::error::Resources/Info.plist NSHumanReadableCopyright must be 'Licensed under GPL-3.0-or-later'"; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Resources/Info.plist)" = 'ch.lkmc.Glims' \
            || { echo "::error::Resources/Info.plist CFBundleIdentifier must be 'ch.lkmc.Glims'"; exit 1; }

      - name: Check the scripts parse
        run: bash -n scripts/*.sh

      - name: Check packaging preflight
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.0'   # pin so a runner-image bump can't change the toolchain

      - name: Check conformance runner ABI refusal
        run: scripts/test-conformance-abi.sh

      - name: Check private component metadata codec
        timeout-minutes: 5
        run: bash scripts/test-plate-map.sh optimized
      - name: Check private native CMYK PSD codec
        timeout-minutes: 5
        run: bash scripts/test-cmyk-psd-codec.sh optimized
      - name: Check private Bitmap PSD codec
        timeout-minutes: 5
        run: bash scripts/test-bitmap-psd-codec.sh optimized
      - name: Check private native CMYK PSD reader
        timeout-minutes: 5
        run: bash scripts/test-cmyk-psd-reader.sh optimized
      - name: Check native CMYK PSD file transaction
        timeout-minutes: 5
        run: bash scripts/test-cmyk-psd-file.sh optimized
      - name: Check private Duotone PSD codec
        timeout-minutes: 5
        run: bash scripts/test-duotone-psd-codec.sh optimized
      - name: Check private Duotone settings
        timeout-minutes: 5
        run: bash scripts/test-duotone-options.sh optimized
      - name: Check Duotone PSD file transaction
        timeout-minutes: 5
        run: bash scripts/test-duotone-psd-file.sh optimized
      - name: Check Bitmap PSD file transaction
        timeout-minutes: 5
        run: bash scripts/test-bitmap-psd-file.sh optimized
      - name: Check Bitmap diffusion
        timeout-minutes: 5
        run: bash scripts/test-bitmap-diffusion.sh optimized
      - name: Check Bitmap PSD transaction faults
        timeout-minutes: 5
        run: bash scripts/test-bitmap-psd-file-faults.sh optimized
      - name: Check native CMYK PSD transaction faults
        timeout-minutes: 5
        run: bash scripts/test-cmyk-psd-file-faults.sh optimized
      - name: Check scalar ink arithmetic
        timeout-minutes: 5
        run: bash scripts/test-component-scalar.sh optimized

      - name: Check scalar ink Levels
        timeout-minutes: 5
        run: bash scripts/test-component-levels.sh optimized
      - name: Check scalar ink Curves on macOS
        run: bash scripts/test-component-curves.sh optimized

      - name: Check Lab samples
        timeout-minutes: 5
        run: python3 scripts/test-lab-samples.py optimized

      - name: Check physical Lab fills
        timeout-minutes: 5
        run: python3 scripts/test-lab-fill.py optimized

      - name: Check physical Lab curves
        timeout-minutes: 5
        run: python3 scripts/test-lab-curves.py optimized

      - name: Check Lab brush coverage
        timeout-minutes: 5
        run: python3 scripts/test-lab-brush-coverage.py optimized

      - name: Check physical layered Lab paint against the rational oracle
        timeout-minutes: 5
        run: python3 scripts/test-lab-layer-paint.py

      - name: Check physical Lab Levels
        timeout-minutes: 5
        run: python3 scripts/test-lab-levels.py optimized

      - name: Check Lab layer map
        timeout-minutes: 5
        run: python3 scripts/test-lab-layer-map.py optimized

      - name: Check Lab layer composite
        timeout-minutes: 5
        run: python3 scripts/test-lab-layer-composite.py optimized

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Hosted runners check interface-only packaging; the engine matrix and
      # release workflow verify the complete app. This also fails when
      # Resources/Third-Party-Notices.txt no longer matches Package.resolved.
      - name: Assemble Glims.app
        run: ./scripts/build-app.sh --shell-only

      - name: Check the built app
        run: |
          APP=dist/Glims.app
          BIN="$APP/Contents/MacOS/Glims"
          RESOURCES="$APP/Contents/Resources"
          test -x "$BIN" || { echo "::error::$BIN missing or not executable"; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'ch.lkmc.Glims' \
            || { echo "::error::built app lost its bundle identifier"; exit 1; }
          test -s "$RESOURCES/AppIcon.icns" || { echo "::error::built app lacks its icon"; exit 1; }
          for notice in LICENSE.txt Third-Party-Notices.txt; do
            test -s "$RESOURCES/$notice" || { echo "::error::$notice missing from Glims.app"; exit 1; }
          done
          cmp -s LICENSE "$RESOURCES/LICENSE.txt" || { echo "::error::LICENSE.txt in the app differs from LICENSE"; exit 1; }
          grep -q '^Rigi ' "$RESOURCES/Third-Party-Notices.txt" \
            || { echo "::error::Third-Party-Notices.txt lacks Rigi"; exit 1; }
          codesign --verify --deep --strict "$APP" \
            || { echo "::error::ad-hoc signature failed verification — the app would not launch"; exit 1; }

      - name: Smoke-test the app
        run: dist/Glims.app/Contents/MacOS/Glims --smoke-test
